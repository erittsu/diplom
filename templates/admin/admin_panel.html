<!-- admin_panel.html -->
{% extends "base.html" %}

{% block title %}Админ-панель | Складской учет{% endblock %}

{% block body_class %}staff-panel{% endblock %}

{% block container_class %}<div class="staff-container">{% endblock %}

{% block content %}
    <!-- Навигационная панель -->
    <div class="staff-navbar">
        <!-- Блок "Управление" -->
        <div class="nav-block">
            <a href="{{ url_for('admin.admin_dashboard') }}" 
               class="nav-btn {% if request.path == url_for('admin.admin_dashboard') %}active{% endif %}">
                <i class="fas fa-home"></i> Главная
            </a>
            <a href="{{ url_for('admin.admin_users') }}" 
               class="nav-btn {% if request.path.startswith('/admin/users') %}active{% endif %}">
                <i class="fas fa-users"></i> Пользователи
            </a>
            <a href="{{ url_for('admin.admin_audit') }}" 
               class="nav-btn {% if request.path.startswith('/admin/audit') %}active{% endif %}">
                <i class="fas fa-clipboard-list"></i> Журнал аудита
            </a>
        </div>

    </div>

    <!-- Контент страницы -->
    <div class="staff-content">
        {% block staff_content %}
        {% endblock %}
    </div>
</div>
{% endblock %}
