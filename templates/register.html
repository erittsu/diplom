{% extends "admin/admin_panel.html" %}

{% block title %}Регистрация нового пользователя | Админ-панель{% endblock %}

{% block staff_content %}
<div class="card">
    <div class="card-header">
        <h3 class="card-title">Регистрация нового пользователя</h3>
    </div>
    <div class="card-body">
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('admin.register') }}">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль:</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
            </div>
            <div class="form-group">
                <label for="role">Роль:</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="admin">Администратор</option>
                    <option value="staff">Сотрудник</option>
                    <option value="supplier">Поставщик</option>
                </select>
            </div>
            <div id="supplier-fields" style="display: none;">
                <div class="form-group">
                    <label for="supplier_name">Название поставщика:</label>
                    <input type="text" class="form-control" id="supplier_name" name="supplier_name">
                </div>
                <div class="form-group">
                    <label for="contact_info">Контактная информация:</label>
                    <input type="text" class="form-control" id="contact_info" name="contact_info">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Зарегистрировать</button>
                <a href="{{ url_for('admin.admin_users') }}" class="btn btn-outline">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
