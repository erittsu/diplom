{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block body_class %}register-page{% endblock %}

{% block container_class %}<div class="register-container">{% endblock %}

{% block content %}
    <div class="register-form">
        <h2>Регистрация нового пользователя</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Подтвердите пароль:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <div class="form-group">
                <label for="role">Роль:</label>
                <select id="role" name="role" required>
                    <option value="admin">Администратор</option>
                    <option value="staff">Сотрудник</option>
                </select>
            </div>
            <button type="submit" class="register-btn">Зарегистрировать</button>
        </form>
        <a href="{{ url_for('admin.admin_panel') }}" class="back-to-admin-btn">Назад к панели админа</a>
    </div>
{% endblock %}
